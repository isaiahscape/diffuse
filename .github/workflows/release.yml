name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (defaults to v<versionName> from app/build.gradle.kts)'
        required: false
        default: ''
      prerelease:
        description: 'Mark manual build as prerelease'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve release metadata
        id: meta
        run: |
          RAW_VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$RAW_VERSION_NAME" ]; then
            echo "::error::Could not extract versionName from app/build.gradle.kts"
            exit 1
          fi
          SAFE_VERSION="$(printf '%s' "$RAW_VERSION_NAME" | sed -E 's/[[:space:]]+/-/g; s/[()]+//g; s/[^A-Za-z0-9._-]+/-/g; s/-+/-/g; s/^-|-$//g')"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE="false"
          else
            CUSTOM_TAG="${{ inputs.tag }}"
            case "$SAFE_VERSION" in
              v*) DEFAULT_TAG="$SAFE_VERSION" ;;
              *) DEFAULT_TAG="v${SAFE_VERSION}" ;;
            esac
            TAG="${CUSTOM_TAG:-$DEFAULT_TAG}"
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${SAFE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_name=${RAW_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Accept licenses & install Android 35 components
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/diffuse-release.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'app/diffuse-release.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --stacktrace testDebugUnitTest assembleRelease

      - name: Stage release APK
        run: |
          mkdir -p release-artifacts
          FOUND=0
          for apk in app/build/outputs/apk/release/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "release-artifacts/Diffuse-${{ steps.meta.outputs.version }}.apk"
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "::error::No release APK found under app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: diffuse-apk-${{ steps.meta.outputs.version }}
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Diffuse ${{ steps.meta.outputs.version_name }}"
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
